name: Malawi assembly tests
# Installs this hub exactly as openimis.json pins it and runs every module's tests, one
# module at a time, so one module's failures cannot hide or break another's. Runs on PRs
# to this hub, nightly on mw/develop, and on demand. The job summary lists each module.
#
# Module repos do not run this: their PRs run only their own module's tests
# (ci_module.yml). This run is the place to see the state of the whole assembly.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 2 * * *'   # nightly, runs on the default branch (mw/develop)
  workflow_dispatch:

jobs:
  ci_assembly:
    name: Assembly tests (all modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      pgsql:
        image: ghcr.io/openimis/openimis-pgsql:develop
        env:
          POSTGRES_DB: test_imis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: YourStrong!Passw0rd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:latest
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          cluster.name: my_opensearch_local
          http.port: 9200
          plugins.security.ssl.http.enabled: false
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: B9wc9VrqX7pY
        options: >-
          --health-cmd "curl -f -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: secret
      MODE: DEV
      DB_DEFAULT: postgresql
      CELERY_BROKER_URL: "memory://openIMIS-test//"
      CELERY_RESULT_BACKEND: "cache+memory://openIMIS-test//"
      DB_HOST: localhost
      DB_PORT: 5432
      # Main and test database are the database the service creates; before this the
      # main database "imis" did not exist and several modules failed to import.
      DB_NAME: test_imis
      DB_TEST_NAME: test_imis
      DB_USER: postgres
      DB_PASSWORD: YourStrong!Passw0rd
      SITE_ROOT: api
      OPENSEARCH_ADMIN: admin
      OPENSEARCH_PASSWORD: B9wc9VrqX7pY
      OPEN_SEARCH_HTTP_PORT: 9200
      OPENSEARCH_HOSTS: "localhost:9200"
      # Space-separated module names to leave out (repo variable); listed in the summary.
      CI_EXCLUDED_MODULE: ${{ vars.CI_EXCLUDED_MODULE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'openimis.json') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install the assembly
        working-directory: ./script
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          python modules-requirements.py ../openimis.json > modules-requirements.txt
          pip install -r modules-requirements.txt
          pip list

      - name: Prepare PostgreSQL
        run: |
          git clone --depth=1 --branch=develop https://github.com/openimis/database_postgresql.git ./sql_psql
          sudo bash ./sql_psql/install_postgres_json_schema_extension.sh
          PGPASSWORD="$DB_PASSWORD" psql -U "$DB_USER" -h "$DB_HOST" -d "$DB_NAME" \
            -f "./sql_psql/database scripts/json_schema_extension.sql" | grep . | uniq -c

      - name: Migrate once and keep a template copy
        working-directory: ./openIMIS
        run: |
          python manage.py migrate --noinput
          # Every module starts from this migrated database, so data one module's tests
          # flush or leave behind cannot change another module's result.
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -U "$DB_USER" -T "$DB_NAME" imis_template

      - name: Run each module's tests
        working-directory: ./openIMIS
        run: |
          fresh_db() {
            export PGPASSWORD="$DB_PASSWORD"
            dropdb -h "$DB_HOST" -U "$DB_USER" --if-exists --force "$DB_NAME"
            createdb -h "$DB_HOST" -U "$DB_USER" -T imis_template "$DB_NAME"
          }
          mkdir -p ../test-logs
          printf '| Module | Tests | Result |\n|---|---|---|\n' > ../summary.md
          FAILED=""
          for MODULE in $(jq -r '.modules[].name' ../openimis.json); do
            if [[ " $CI_EXCLUDED_MODULE " == *" $MODULE "* ]]; then
              echo "| $MODULE | - | excluded (CI_EXCLUDED_MODULE) |" >> ../summary.md
              continue
            fi
            echo "::group::$MODULE"
            fresh_db
            if python manage.py test --keepdb --noinput "$MODULE" > "../test-logs/$MODULE.txt" 2>&1; then STATUS=ok; else STATUS=failed; fi
            tail -40 "../test-logs/$MODULE.txt"
            echo "::endgroup::"
            RAN=$(grep -oE '^Ran [0-9]+ tests?' "../test-logs/$MODULE.txt" | grep -oE '[0-9]+' | tail -1)
            LINE=$(grep -E '^(OK|FAILED)' "../test-logs/$MODULE.txt" | tail -1)
            if [[ "$STATUS" == ok ]]; then
              echo "| $MODULE | ${RAN:-0} | ✅ ${LINE:-OK} |" >> ../summary.md
            else
              echo "| $MODULE | ${RAN:-0} | ❌ ${LINE:-did not finish, see log} |" >> ../summary.md
              FAILED="$FAILED $MODULE"
            fi
          done
          {
            echo "### Assembly tests, one module at a time"
            echo
            cat ../summary.md
            echo
            echo "Failed:${FAILED:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$FAILED" ]]; then
            echo "::error::Modules with failing tests:$FAILED"
            exit 1
          fi

      - name: Upload per-module test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly-test-logs
          path: test-logs/
