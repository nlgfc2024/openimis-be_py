# Malawi (NLGFC) manual image build — pick the branch/tag to build and the image tag to publish.
# Publishes ONLY to ghcr.io/nlgfc2024; nothing is pushed to the openimis org.
name: Build manual backend image (nlgfc2024)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build from'
        required: true
        default: 'mw/develop'
      tag:
        description: 'Image tag to publish (e.g. 26.04, rc1, test)'
        required: true
      file_url:
        description: 'Optional URL (CURL compatible) of a custom openimis.json'
        required: false

jobs:
  publish-manual-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to push to ghcr.io/nlgfc2024
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download custom openimis.json
        if: ${{ inputs.file_url != '' }}
        run: curl -o ./openimis.json "${{ inputs.file_url }}"

      - name: Build and push the backend image
        run: |
          IMAGE=ghcr.io/nlgfc2024/openimis-be
          docker build . --tag "${IMAGE}:${{ inputs.tag }}"
          docker push "${IMAGE}:${{ inputs.tag }}"
