name: Malawi module CI
# Reusable workflow called by every nlgfc2024 backend module repo (see their ci.yml).
#
# It installs the Malawi backend assembly (nlgfc2024/openimis-be_py, using the pins in its
# openimis.json), swaps in the module under test from the PR head, and runs that module's
# Django tests against PostgreSQL. Only the module's own tests decide the result; the full
# suite of every module runs on the hub itself (ci_assembly.yml).
#
# A green run means tests really ran and passed: the job fails if no tests were found.
# flake8 is reported in the job summary and never fails the run.
on:
  workflow_call:
    inputs:
      be_fallback_branch:
        description: Hub branch used when the hub has no branch matching the PR base / pushed branch
        required: false
        type: string
        default: mw/develop
      test_args:
        description: Extra arguments for manage.py test
        required: false
        type: string
        default: --keepdb
      allow_no_tests:
        description: Pass even if the module has no tests (only for modules that genuinely have none yet)
        required: false
        type: boolean
        default: false
      # Accepted and ignored, so callers that still pass the old SonarCloud settings keep working.
      SONAR_PROJECT_KEY: {required: false, type: string}
      SONAR_ORGANIZATION: {required: false, type: string}
      SONAR_PROJECT_NAME: {required: false, type: string}
      SONAR_PROJECT_VERSION: {required: false, type: string}
      SONAR_EXCLUSIONS: {required: false, type: string}
      SONAR_SOURCES: {required: false, type: string}
      branchName: {required: false, type: string}
    secrets:
      SONAR_TOKEN:
        required: false

env:
  HUB_REPOSITORY: nlgfc2024/openimis-be_py

jobs:
  module_tests:
    name: Module tests
    runs-on: ubuntu-24.04
    services:
      opensearch:
        image: opensearchproject/opensearch:latest
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          cluster.name: my_opensearch_local
          http.port: 9200
          plugins.security.ssl.http.enabled: false
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: B9wc9VrqX7pY
        options: >-
          --health-cmd "curl -f -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pgsql:
        image: ghcr.io/openimis/openimis-pgsql:develop
        env:
          POSTGRES_DB: test_imis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: YourStrong!Passw0rd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: secret
      MODE: DEV
      DB_DEFAULT: postgresql
      CELERY_BROKER_URL: "memory://openIMIS-test//"
      CELERY_RESULT_BACKEND: "cache+memory://openIMIS-test//"
      DB_HOST: localhost
      DB_PORT: 5432
      # Main and test database are the same database the service creates, so code that
      # touches the database at import time finds one.
      DB_NAME: test_imis
      DB_TEST_NAME: test_imis
      DB_USER: postgres
      DB_PASSWORD: YourStrong!Passw0rd
      SITE_ROOT: api
      OPENSEARCH_ADMIN: admin
      OPENSEARCH_PASSWORD: B9wc9VrqX7pY
      OPEN_SEARCH_HTTP_PORT: 9200
      OPENSEARCH_HOSTS: "localhost:9200"
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Choose the hub branch
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSHED_REF: ${{ github.ref_name }}
          FALLBACK: ${{ inputs.be_fallback_branch }}
        run: |
          # PRs use the hub branch named like the PR base (mw/develop, jobs-now/develop,
          # release/mw/...); pushes use the hub branch named like the pushed branch.
          # Anything the hub does not have (stacked feature branches) uses the fallback.
          # Never upstream openimis: that would test against the wrong pins.
          if [[ "$EVENT" == pull_request* ]]; then WANTED="$PR_BASE_REF"; else WANTED="$PUSHED_REF"; fi
          if [[ -n "$WANTED" ]] && git ls-remote --exit-code --heads "https://github.com/$HUB_REPOSITORY.git" "refs/heads/$WANTED" > /dev/null; then
            HUB_BRANCH="$WANTED"
          else
            HUB_BRANCH="$FALLBACK"
          fi
          echo "HUB_BRANCH=$HUB_BRANCH" >> "$GITHUB_ENV"
          echo "Wanted hub branch '$WANTED', using '$HUB_BRANCH'"

      - name: Check out the hub
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HUB_REPOSITORY }}
          ref: ${{ env.HUB_BRANCH }}
          path: openimis

      - name: Check out the module under test
        uses: actions/checkout@v4
        with:
          path: current-module

      - name: Use the module under test in openimis.json
        working-directory: ./openimis
        run: |
          MODULE_NAME="$(echo "$GITHUB_REPOSITORY" | sed 's#^[^/]*/openimis-be-\(.*\)_py$#\1#')"
          echo "MODULE_NAME=$MODULE_NAME" >> "$GITHUB_ENV"
          jq --arg name "$MODULE_NAME" '
            if any(.modules[]; .name == $name)
            then (.modules[] | select(.name == $name) | .pip) |= "-e ../../current-module"
            else .modules += [{name: $name, pip: "-e ../../current-module"}] end' openimis.json > openimis.json.new
          mv openimis.json.new openimis.json
          jq -c '.modules[] | select(.name == env.MODULE_NAME)' openimis.json

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('openimis/requirements.txt', 'openimis/openimis.json') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install the assembly
        working-directory: ./openimis/script
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          python modules-requirements.py ../openimis.json > modules-requirements.txt
          cat modules-requirements.txt
          pip install -r modules-requirements.txt
          pip list

      - name: Prepare PostgreSQL
        run: |
          git clone --depth=1 --branch=develop https://github.com/openimis/database_postgresql.git ./sql_psql
          sudo bash ./sql_psql/install_postgres_json_schema_extension.sh
          PGPASSWORD="$DB_PASSWORD" psql -U "$DB_USER" -h "$DB_HOST" -d "$DB_NAME" \
            -f "./sql_psql/database scripts/json_schema_extension.sql" | grep . | uniq -c

      - name: Run the module's tests
        working-directory: ./openimis/openIMIS
        env:
          TEST_ARGS: ${{ inputs.test_args }}
          ALLOW_NO_TESTS: ${{ inputs.allow_no_tests }}
        run: |
          set -o pipefail
          # TEST_ARGS is unquoted on purpose: it may hold several arguments.
          python manage.py test $TEST_ARGS "$MODULE_NAME" 2>&1 | tee ../../test-output.txt
          RAN=$(grep -oE '^Ran [0-9]+ tests?' ../../test-output.txt | grep -oE '[0-9]+' | tail -1)
          RAN=${RAN:-0}
          echo "TESTS_RAN=$RAN" >> "$GITHUB_ENV"
          if [[ "$RAN" == "0" && "$ALLOW_NO_TESTS" != "true" ]]; then
            echo "::error::No tests ran for $MODULE_NAME. A green check must mean tests ran."
            exit 1
          fi

      - name: flake8 report (does not fail the run)
        if: always()
        continue-on-error: true
        run: |
          pip install flake8 > /dev/null
          python -m flake8 "current-module/$MODULE_NAME" --exit-zero --ignore W503,E501 \
            --exclude "*/migrations/*" > flake8-report.txt
          COUNT=$(wc -l < flake8-report.txt)
          {
            echo "### flake8: $COUNT finding(s) (report only)"
            if [[ "$COUNT" -gt 0 ]]; then
              echo '<details><summary>Show</summary>'; echo; echo '```'
              head -200 flake8-report.txt; echo '```'; echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          HUB_SHA=$(git -C openimis rev-parse --short HEAD)
          MOD_SHA=$(git -C current-module rev-parse --short HEAD)
          RESULT=$(grep -E '^(OK|FAILED)' test-output.txt 2>/dev/null | tail -1)
          {
            echo "### $MODULE_NAME module tests"
            echo "- Hub: \`$HUB_REPOSITORY@$HUB_BRANCH\` ($HUB_SHA)"
            echo "- Module: \`$GITHUB_REPOSITORY\` ($MOD_SHA)"
            echo "- Tests ran: ${TESTS_RAN:-not reached}"
            echo "- Result: ${RESULT:-no result line, see the log}"
          } >> "$GITHUB_STEP_SUMMARY"
