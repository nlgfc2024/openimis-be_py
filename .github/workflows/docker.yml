# Malawi (NLGFC) live develop image — built from the default branch mw/develop.
# Runs on every push to mw/develop and once daily; publishes ONLY to ghcr.io/nlgfc2024.
# Nothing is pushed to the openimis org.
# NOTE: a Docker/OCI tag cannot contain "/", so the mw/develop branch maps to the
# tag "mw-develop".
name: Build mw/develop backend image (nlgfc2024)

on:
  push:
    branches:
      - mw/develop
  schedule:
    - cron: "0 2 * * *"   # daily rebuild of the mw/develop image
  workflow_dispatch: {}

concurrency:
  group: mw-develop-image-be
  cancel-in-progress: true

jobs:
  publish-mw-develop-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to push to ghcr.io/nlgfc2024
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mw/develop

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the mw/develop backend image
        run: |
          IMAGE=ghcr.io/nlgfc2024/openimis-be
          SHA=$(git rev-parse --short HEAD)
          docker build . \
            --tag "${IMAGE}:mw-develop" \
            --tag "${IMAGE}:${SHA}"
          docker push "${IMAGE}:mw-develop"
          docker push "${IMAGE}:${SHA}"
